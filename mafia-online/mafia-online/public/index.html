<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Franklin:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dde2dc; --surface:#eef0ea; --surface2:#cdd5cd; --ink:#12201f; --muted:#47585a;
  --line:#a7b3ac; --edge:#12201f; --accent:#b3141f; --accent-ink:#fff7f2; --good:#1f6b3a; --warn:#96600a; --bad:#b3141f;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --body:'Libre Franklin',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --type:'Special Elite','Courier New',Courier,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1517; --surface:#142124; --surface2:#1c2d31; --ink:#e6ebe6; --muted:#94a7a5;
    --line:#2b4045; --edge:#e6ebe6; --accent:#ef4b4b; --accent-ink:#1a0505; --good:#5fcf8b; --warn:#f0b34a; --bad:#ff6b6b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1517; --surface:#142124; --surface2:#1c2d31; --ink:#e6ebe6; --muted:#94a7a5;
  --line:#2b4045; --edge:#e6ebe6; --accent:#ef4b4b; --accent-ink:#1a0505; --good:#5fcf8b; --warn:#f0b34a; --bad:#ff6b6b;
  color-scheme:dark;
}
:root.night{
  --bg:#070d12; --surface:#0f1922; --surface2:#16242f; --ink:#f0e8d6; --muted:#8fa0ad;
  --line:#24384a; --edge:#f2a93b; --accent:#f2a93b; --accent-ink:#1a1000; --good:#7ddf9f; --warn:#f2c46b; --bad:#ff7a6b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);transition:background .5s}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
button,input,select{font-family:inherit;color:inherit}
.app{max-width:1080px;margin:0 auto;padding:12px 18px 56px}
.narrow{max-width:560px;margin:0 auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,60px);line-height:1.02;margin:0}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,38px);line-height:1.08;margin:0 0 6px}
.h3{font-size:17px;font-weight:700;margin:0 0 4px}
.note{font-family:var(--type);font-size:15px;color:var(--muted);margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:14px} p{margin:0 0 10px} .center{text-align:center}
.stack{display:flex;flex-direction:column;gap:16px} .stack.tight{gap:10px}
.title{font-family:var(--display);font-size:clamp(96px,30vw,160px);line-height:.88;margin:0}
.stamp{display:inline-block;font-family:var(--type);font-size:19px;color:var(--accent);border:3px solid var(--accent);padding:4px 12px;border-radius:4px;transform:rotate(-3deg);margin:10px 0 16px}
.lede{font-size:18px;max-width:38ch}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.06em}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px}

.btn{appearance:none;display:block;width:100%;background:var(--surface);border:2px solid var(--edge);border-radius:10px;padding:14px 18px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{padding:18px;font-size:19px;min-height:60px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:active{transform:none;box-shadow:0 3px 0 var(--edge)}
.btn.quiet{box-shadow:none;border-color:var(--line);font-weight:600}
.btn.quiet:active{transform:none}
.btn.inline{display:inline-block;width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--edge);border-radius:6px;padding:16px}
.panel .note{margin-bottom:10px}
.field{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;width:100%;font-size:17px;padding:12px 14px;min-height:50px;border:2px solid var(--edge);border-radius:10px;background:var(--bg)}
select{font-size:16px;padding:8px 10px;min-height:44px;border:2px solid var(--edge);border-radius:10px;background:var(--bg)}
.err{color:var(--bad);font-weight:600;margin:8px 0 0}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:7px;padding:10px 6px;min-height:44px;font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 0 0 2px var(--edge) inset}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rn{font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{appearance:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper span{min-width:26px;text-align:center;font-weight:700;font-size:18px}
.sw{appearance:none;width:52px;height:30px;border-radius:999px;border:2px solid var(--edge);background:var(--surface2);position:relative;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--edge);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--accent-ink)}
.sw:disabled{opacity:.5;cursor:default}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--type)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.feat{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start}

/* room */
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.rtop .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;min-height:40px;cursor:pointer;font-size:15px}
.phase{font-family:var(--display);font-size:22px;letter-spacing:.03em}
.timer{font-family:var(--display);font-size:26px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.iconbtn{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;padding:0 12px;font-size:18px;cursor:pointer}
.iconbtn.on{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset}
.pingchip{font-family:var(--type);font-size:14px}
.banner{background:var(--bad);color:#fff;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.roomgrid{display:grid;gap:18px}
@media (min-width:900px){.roomgrid{grid-template-columns:minmax(0,1fr) 380px;align-items:start}.colR{position:sticky;top:12px}#msgs{height:380px!important}}
.colL,.colR{display:flex;flex-direction:column;gap:16px;min-width:0}
.bigname{font-family:var(--display);font-size:clamp(40px,12vw,64px);line-height:1;word-break:break-word;margin:6px 0}
.roleicon{font-size:76px;line-height:1}.roleicon.sm{font-size:48px}
.rolename{font-family:var(--display);font-size:clamp(44px,13vw,60px);line-height:1;margin:6px 0 10px}
.teamtag{display:inline-block;font-family:var(--type);border:2px solid var(--edge);border-radius:4px;padding:2px 10px;margin-bottom:12px}
.verdict{font-family:var(--type);font-size:20px;border:3px solid currentColor;display:inline-block;padding:1px 10px;border-radius:5px;margin-left:6px}
.verdict.bad{color:var(--bad)}.verdict.good{color:var(--good)}
.code{font-family:var(--display);font-size:54px;letter-spacing:.14em;line-height:1}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{font-size:14px;min-height:44px}
.linkbox .btn{width:auto;padding:0 16px;min-height:44px;box-shadow:none;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pl{position:relative;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-height:118px;user-select:none}
.pl.me{border-color:var(--edge)}
.pl.tgt{cursor:pointer;border-color:var(--accent);border-style:dashed}
.pl.sel{background:var(--accent);color:var(--accent-ink);border-style:solid}
.pl.sel .ping,.pl.sel .rtag,.pl.sel .vtag{color:inherit}
.pl.dead{opacity:.55}.pl.dead .nm{text-decoration:line-through}
.av{position:relative;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;color:#111;margin-bottom:2px;transition:box-shadow .1s}
.av.speaking{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--good)}
.nm{font-weight:700;word-break:break-word;line-height:1.2}
.ping{font-family:var(--type);font-size:13px;color:var(--muted);line-height:1.2}
.ping.good{color:var(--good)}.ping.warn{color:var(--warn)}.ping.bad{color:var(--bad);font-weight:700}
.rtag{font-size:13px;font-weight:600}
.vtag{font-family:var(--type);font-size:13px;color:var(--accent)}
.chatbox{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--edge);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
#msgs{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.msg{font-size:15px;line-height:1.35;word-break:break-word}
.msg .who{font-weight:700}
.msg.sys{font-family:var(--type);color:var(--muted);font-size:14px}
.msg.mafia{border-left:3px solid var(--accent);padding-left:8px}
.msg.dead{opacity:.8;font-style:italic}
#chatForm{display:flex;gap:8px}
#chatForm input{min-height:46px;font-size:16px}
#chatForm button{appearance:none;border:2px solid var(--edge);background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:0 16px;min-height:46px;cursor:pointer}
#chatForm button:disabled,#chatForm input:disabled{opacity:.5}
.rosterrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rosterrow:first-of-type{border-top:0}.rosterrow.out{opacity:.6}
.log{list-style:none;margin:0;padding:0;font-family:var(--type);font-size:15px}
.log li{padding:6px 0;border-top:1px dashed var(--line)}.log li:first-child{border-top:0}.log b{color:var(--accent)}
.script{font-family:var(--type);border-left:4px solid var(--accent);padding:4px 0 4px 12px;text-align:left}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:20}
.modal{background:var(--surface);border:2px solid var(--edge);border-radius:10px;padding:20px;max-width:380px;width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* ================= the stage: skyline that follows day and night ================= */
.stage{--r:80px;--sk:#33475a;position:relative;height:150px;border-radius:14px;overflow:hidden;border:2px solid var(--edge);isolation:isolate;background:#050914}
.stage.tall{height:250px;--r:118px}
.stage.full{position:absolute;inset:0;height:auto;border:0;border-radius:0;--r:52vh}
.stage[data-t="dusk"]{--sk:#1c2141}
.stage[data-t="night"]{--sk:#05070d}
.stage .sky{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.stage .sky.day{background:linear-gradient(#5fb3e8 0%,#b9e2f3 62%,#ffe7b3 100%)}
.stage .sky.dusk{background:linear-gradient(#2a3563 0%,#b9527a 58%,#ffb26b 100%)}
.stage .sky.night{background:linear-gradient(#04070f 0%,#0c1533 62%,#1b2750 100%)}
.stage[data-t="day"] .sky.day,.stage[data-t="dusk"] .sky.dusk,.stage[data-t="night"] .sky.night{opacity:1}
.stage .stars{position:absolute;inset:0;opacity:0;transition:opacity 1.6s}
.stage[data-t="night"] .stars{opacity:1}
.stage[data-t="dusk"] .stars{opacity:.25}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3.2s ease-in-out infinite}
.stage .orb{position:absolute;bottom:0;width:54px;height:54px;border-radius:50%;transform:translateY(130%);transition:transform 1.9s cubic-bezier(.22,.8,.3,1)}
.stage.full .orb{width:96px;height:96px}
.stage .sun{left:68%;background:radial-gradient(circle,#fffbe0,#ffd75e 55%,#ffb02e);box-shadow:0 0 50px 14px rgba(255,200,80,.55)}
.stage .moon{left:20%;background:radial-gradient(circle at 36% 34%,#fffef4,#e2e8f6 58%,#b6c1db);box-shadow:0 0 44px 10px rgba(190,205,255,.32)}
.stage[data-t="day"] .sun{transform:translateY(calc(var(--r) * -1))}
.stage[data-t="dusk"] .sun{transform:translateY(calc(var(--r) * -.3))}
.stage[data-t="night"] .moon{transform:translateY(calc(var(--r) * -1))}
.stage .cloud{position:absolute;top:16%;left:0;height:16px;width:84px;border-radius:20px;background:rgba(255,255,255,.85);filter:blur(1.5px);opacity:0;transition:opacity 1.6s;animation:drift 42s linear infinite}
.stage .cloud.c2{top:36%;width:116px;animation-duration:64s;animation-delay:-24s}
.stage[data-t="day"] .cloud{opacity:.9}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:56%}
.skyline .bld rect{fill:var(--sk);transition:fill 1.6s}
.skyline .wins rect{fill:#ffd166;opacity:0;transition:opacity 1.6s}
.stage[data-t="dusk"] .skyline .wins rect{opacity:.55}
.stage[data-t="night"] .skyline .wins rect{opacity:.95;animation:twinkle 6s ease-in-out infinite}
.stage .over{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:0 18px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.stage .over.end{justify-content:flex-end;padding-bottom:10px}
.stage .cap{font-family:var(--type);font-size:15px}
.stage.hero .title{color:#fff;font-size:clamp(84px,27vw,140px);text-shadow:0 4px 30px rgba(0,0,0,.55)}
.stage.hero .stamp{align-self:flex-start;margin:6px 0 0;background:rgba(0,0,0,.35);color:#ff9a9a;border-color:#ff7070;text-shadow:none}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(620px)}}
@keyframes twinkle{50%{opacity:.35}}

/* ================= motion: cards, panels, role reveal ================= */
#main.enter>*{animation:panelIn .5s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.985)}}
.pgrid.enter .pl{animation:cardIn .45s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.94)}}
.flipin{animation:flipIn 1s .25s cubic-bezier(.2,.8,.3,1) backwards;transform-origin:center}
@keyframes flipIn{from{transform:perspective(900px) rotateY(88deg);opacity:0}60%{transform:perspective(900px) rotateY(-10deg)}}
.pl{transition:transform .15s,border-color .2s,background .2s}
.pl.tgt:hover{transform:translateY(-2px)}
.pl.sel{animation:selPulse 1.6s ease-in-out infinite}
@keyframes selPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}}

/* ================= cinematic scenes ================= */
#cine{position:fixed;inset:0;z-index:40;display:none;cursor:pointer;background:#000}
#cine.on{display:block}
.scene{position:absolute;inset:0;overflow:hidden;animation:sceneIn .4s ease backwards;transition:opacity .4s}
.scene.out{opacity:0}
@keyframes sceneIn{from{opacity:0}}
.scene .ctext{position:absolute;left:0;right:0;bottom:13%;z-index:6;text-align:center;padding:0 22px;color:#fff;text-shadow:0 2px 22px rgba(0,0,0,.7);animation:rise .9s .5s ease backwards}
.ctext .ck{font-family:var(--type);font-size:18px;opacity:.85}
.ctext .ct{font-family:var(--display);font-size:clamp(40px,11vw,80px);line-height:1.02}
.ctext .cs{font-size:18px;margin-top:8px;opacity:.92}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.skiphint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:7;font-family:var(--type);color:rgba(255,255,255,.55);font-size:13px}
.scene .av.big{width:124px;height:124px;font-size:68px;margin:0}
.scene .target{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:3}
/* murder */
.sc-murder{background:radial-gradient(circle at 50% 38%,#43090f 0%,#140308 60%,#000 100%)}
.sc-murder .shk{position:absolute;inset:0;animation:shake .55s .9s}
.sc-murder .target .av{filter:grayscale(1) brightness(.5);opacity:.14;animation:struck 1.5s .9s cubic-bezier(.5,0,.9,.4) backwards}
@keyframes struck{0%,45%{filter:none;opacity:1;transform:none}100%{transform:translateY(34px) rotate(9deg) scale(.92)}}
.sc-murder .rip{position:absolute;left:50%;top:38%;z-index:4;font-size:96px;transform:translate(-50%,-50%);animation:drop .8s 2s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes drop{from{opacity:0;transform:translate(-50%,-260%) scale(1.3)}}
.slashes{position:absolute;left:50%;top:38%;width:min(78vw,340px);height:min(78vw,340px);transform:translate(-50%,-50%);z-index:5;overflow:visible}
.slashes path{fill:none;stroke:#ff2d3d;stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;filter:drop-shadow(0 0 8px #ff2d3d);animation:draw .28s ease-out backwards}
.slashes path:nth-child(1){animation-delay:.9s}.slashes path:nth-child(2){animation-delay:1.08s}.slashes path:nth-child(3){animation-delay:1.26s}
@keyframes draw{from{stroke-dashoffset:1}}
.scene .flash{position:absolute;inset:0;z-index:8;background:#ff1a2b;opacity:0;pointer-events:none;animation:flash .55s .9s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@keyframes shake{20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,6px)}}
/* doctor save */
.sc-save{background:radial-gradient(circle at 50% 38%,#07443b 0%,#031510 68%,#000 100%)}
.sc-save .rings i{position:absolute;left:50%;top:38%;width:130px;height:130px;border:3px solid #38f2b6;border-radius:50%;opacity:0;z-index:2;transform:translate(-50%,-50%) scale(3);animation:ring 2.2s 1s ease-out infinite}
.sc-save .rings i:nth-child(2){animation-delay:1.6s}.sc-save .rings i:nth-child(3){animation-delay:2.2s}
@keyframes ring{from{opacity:.95;transform:translate(-50%,-50%) scale(.7)}to{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
.sc-save .target .av{animation:heartbeat 1.1s 1s ease-in-out 3}
@keyframes heartbeat{25%{transform:scale(1.1)}50%{transform:scale(.97)}}
.sc-save .cross{position:absolute;left:50%;top:38%;z-index:5;transform:translate(70px,-64px);font-size:58px;color:#38f2b6;text-shadow:0 0 22px #38f2b6;animation:pop .6s 1s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes pop{from{opacity:0;transform:translate(70px,-64px) scale(0)}}
.ecg{position:absolute;left:0;right:0;top:63%;width:100%;height:70px;z-index:3}
.ecg path{fill:none;stroke:#38f2b6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;filter:drop-shadow(0 0 6px #38f2b6);animation:draw 1.6s 1.2s ease-out backwards}
.sc-save .flash{background:#ff1a2b;animation-delay:.15s;animation-duration:.4s}
/* verdict */
.sc-verdict{background:#080b12}

<script>
'use strict';
/* =====================================================================================

const WIN = {
  town:   { icon: '🏘️', title: 'Town wins', text: 'Every Mafia member has been eliminated.' },
  mafia:  { icon: '🕶️', title: 'Mafia wins', text: 'The Mafia now control the vote.' },
  sk:     { icon: '☠️', title: 'The Serial Killer wins', text: 'They are the last one standing.' },
  jester: { icon: '🤡', title: 'The Jester wins', text: 'They got themselves voted out.' },

const PHASE_LABEL = { lobby: 'Lobby', reveal: 'Your role', night: 'Night', dawn: 'Dawn', day: 'Day', vote: 'Vote', result: 'Verdict', over: 'Game over' };

/* ---------- state ---------- */
let cfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let session = null;          // {code,pid,token}
let st = null;               // latest server view
let pings = {};              // id -> {ms,c,st,left}
let offset = 0;              // serverNow - clientNow
let es = null;
const ui = { name: '', gender: 'neutral', inviteCode: null, online: true, myPing: null, micOn: false, ttsOn: true, narratorOn: true, said: new Set(), intro: {}, sfxOn: true, voicePref: store.get('mafia:voices') || {}, animCards: false, audioSig: '',
             detPick: null, pendingSel: null, phaseKey: '', mainSig: '', audioBlocked: false, homeErr: '', mafiaAction: 'attack' };

/* =====================================================================================
 * TEXT-TO-SPEECH: chat is read aloud in a male / female / neutral voice, chosen at join
 * ===================================================================================== */
const TTS = { ok: typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined', voices: [], queue: [], busy: false, cur: null };
function loadVoices() { if (TTS.ok) TTS.voices = speechSynthesis.getVoices() || []; }
if (TTS.ok) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); ui.audioSig = ''; if (st) renderAudio(); }; }
/* Voice quality depends on what the device has installed, so we rank every installed voice and use the most natural one.
 * Natural / Neural / Online voices (Microsoft Edge), Premium / Enhanced (Apple) and Google voices beat the old robotic ones. */
const FEM = /female|woman|zira|samantha|susan|karen|victoria|hazel|aria|jenny|tessa|moira|fiona|allison|ava\b|serena|kate|catherine|sara\b|amy|emma|joanna|salli|kimberly|ivy|libby|sonia|natasha|clara|nova|shimmer|siri|neerja|heera|swara|priya|veena|lekha|kalpana|michelle|ana\b|sonia|maisie|google us english$/i;
const MAL = /\bmale\b|david|mark\b|daniel|alex\b|george|guy\b|ryan|thomas|oliver|arthur|james|matthew|joey|justin|brian|russell|liam|davis|eric\b|roger|steffan|onyx|echo|prabhat|ravi|hemant|rishi|christopher|tony|aaron|gordon|rocko|reed/i;
const BAD_VOICE = /espeak|compact|albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred\b|junior|ralph|kathy/i;
function voiceScore(v) {
  const n = v.name || '', l = v.lang || ''; let sc = 0;
  if (/natural|neural|online/i.test(n)) sc += 60;
  if (/premium|enhanced|siri/i.test(n)) sc += 40;
  if (/^google/i.test(n)) sc += 25;
  if (/microsoft/i.test(n)) sc += 10;
  if (/en[-_]IN/i.test(l)) sc += 14; else if (/en[-_](US|GB)/i.test(l)) sc += 10; else if (/^en/i.test(l)) sc += 4;
  if (BAD_VOICE.test(n)) sc -= 100;

  const en = TTS.voices.filter(v => /^en/i.test(v.lang));

function voiceMatches(v, gender) {
  if (gender === 'female') return FEM.test(v.name);
  if (gender === 'male') return MAL.test(v.name) && !FEM.test(v.name);
  return MAL.test(v.name) && !FEM.test(v.name);            // narrator: prefer a deeper voice
}
function pickVoice(gender) {
  const pref = ui.voicePref && ui.voicePref[gender];
  if (pref) { const v = TTS.voices.find(x => x.name === pref); if (v) return { v, exact: true }; }
  const list = goodVoices();
  const m = list.find(v => voiceMatches(v, gender));

function speak(text, gender, priority) {

  ensureCtx(); resumeAudio();
}, { passive: true });

/* =====================================================================================
 * VOICE CHAT: WebRTC mesh. The server says who you may talk to / hear right now.
 * Night: only the Mafia hear each other. Day: living players. Ghosts: only ghosts speak to ghosts.
 * ===================================================================================== */

}
function meterLoop() {

    let sum = 0; for (let i = 0; i < m.buf.length; i++) { const v = (m.buf[i] - 128) / 128; sum += v * v; }
    const talking = Math.sqrt(sum / m.buf.length) > 0.035;
    const id = key === 'me' ? st.meId : key;
    const ok = key === 'me' ? (ui.micOn && voice.track && voice.track.enabled && st.voice.to.length > 0) : from.has(id);

async function toggleMic() {

      voice.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });

      addMeter('me', voice.stream);
      ui.micOn = true;

      toast(e && e.name === 'NotAllowedError' ? 'Microphone blocked. Allow it in your browser settings.' : 'Could not open the microphone.');
      return;

    voice.track.enabled = ui.micOn;

function sendSignal(to, data) { api('signal', { to, data }, { quiet: true, retry: 1 }); }
function makePeer(id, opts) {

  // offer itself (browsers do not reuse a slot made with addTransceiver when answering), see onSignal.

async function makeOffer(e) {

}

}
function resetPeer(id) {

  const e = makePeer(id, { noOffer: st.meId > id });

}
async function onSignal(msg) {

  let e = peers.get(from);
  try {
    if (d.reset) { if (st.meId < from) { closePeer(from); makePeer(from); applyVoice(); } return; }
    if (d.sdp) {
      if (d.sdp.type === 'offer') {
        if (e && (['failed', 'closed', 'disconnected'].includes(e.pc.connectionState) || e.pc.signalingState !== 'stable')) { closePeer(from); e = null; }
        if (!e) e = makePeer(from, { noOffer: true });
        await e.pc.setRemoteDescription(d.sdp);
        if (!e.tr) e.tr = e.pc.getTransceivers().find(t => t.receiver && t.direction !== 'stopped') || null;

        for (const c of e.pending.splice(0)) await e.pc.addIceCandidate(c).catch(() => {});

function watchPeers() {              // a voice link that is still not up after a few seconds gets a fresh start
  if (!st) return;

  for (const e of [...peers.values()]) {
    const cs = linkState(e);
    if (cs === 'connected' || cs === 'completed') continue;
    const other = st.players.find(p => p.id === e.id);
    if (other && other.connected && now - e.born > (e.initiator ? 8000 : 14000)) resetPeer(e.id);

}
function paintLinks() {
  const el = $('#vlinks'); if (!el || !st) return;
  const rows = [];
  for (const e of peers.values()) {
    const cs = linkState(e);
    const ic = (cs === 'connected' || cs === 'completed') ? '✅' : (cs === 'failed' || cs === 'closed') ? '⚠️' : '⏳';
    rows.push(ic + ' ' + esc(nameOf(e.id)));
  }

function syncPeers() {
  if (!st || typeof RTCPeerConnection === 'undefined') return;
  const want = new Set(st.players.filter(p => p.id !== st.meId && !p.left).map(p => p.id));
  for (const id of [...peers.keys()]) if (!want.has(id)) closePeer(id);
  for (const id of want) if (!peers.has(id)) makePeer(id);

  if (!st) return;
  const to = new Set(st.voice.to), from = new Set(st.voice.from);
  for (const e of peers.values()) {
    const track = (ui.micOn && voice.track && to.has(e.id)) ? voice.track : null;
    const flag = track ? 1 : 0;
    if (e.tr && e.sending !== flag) { e.tr.sender.replaceTrack(track).catch(() => {}); e.sending = flag; }
    e.audio.muted = !from.has(e.id);

/* =====================================================================================
 * SOUND EFFECTS (synthesised in the browser, no files) — night, morning, murder, save, verdict
 * ===================================================================================== */
function tone(f, d, type, vol, at, to) {

  o.type = type; o.frequency.setValueAtTime(f, at); if (to) o.frequency.exponentialRampToValueAtTime(to, at + d);

const SFX_DEF = {

  morning: t => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.9, 'sine', 0.07, t + i * 0.22)); },
  kill:    t => { noise(0.4, 0.4, t + 0.9, 2600); tone(1400, 0.22, 'sawtooth', 0.1, t + 0.9, 180); tone(70, 0.7, 'sine', 0.35, t + 0.95, 38); tone(55, 1.1, 'triangle', 0.14, t + 2, 40); },
  save:    t => { noise(0.2, 0.25, t + 0.15, 1800); tone(880, 1.3, 'sine', 0.09, t + 0.7); tone(1320, 1.4, 'sine', 0.07, t + 0.9); tone(1760, 1.6, 'sine', 0.05, t + 1.1); },
  verdict: t => { tone(90, 0.6, 'sine', 0.35, t + 0.9, 50); noise(0.25, 0.3, t + 0.9, 900); },
  win:     t => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.55, 'triangle', 0.08, t + 0.4 + i * 0.14)); },
  lose:    t => { [392, 330, 262].forEach((f, i) => tone(f, 0.9, 'sawtooth', 0.05, t + 0.4 + i * 0.32)); }

function sfx(name) {

function skylineSVG() {
  const b = [[0,26,30],[26,20,44],[46,30,26],[76,18,52],[94,28,36],[122,22,60],[144,30,34],[174,20,48],[194,32,28],[226,24,56],[250,28,38],[278,20,46],[298,34,30],[332,22,54],[354,46,34]];
  let r = '', w = '';
  b.forEach(([x, ww, h], i) => {
    r += `<rect x="${x}" y="${80 - h}" width="${ww}" height="${h}"/>`;
    for (let yy = 80 - h + 6; yy < 74; yy += 9) for (let xx = x + 4; xx < x + ww - 4; xx += 7) if (((xx * 7 + yy * 13 + i) % 5) < 2) w += `<rect x="${xx}" y="${yy}" width="3" height="4" style="animation-delay:${((xx + yy) % 9) * 0.7}s"/>`;
  });
  return `<svg class="skyline" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true"><g class="bld">${r}</g><g class="wins">${w}</g></svg>`;
}

/* =====================================================================================
 * NETWORK: SSE in, JSON POST out. Heartbeat measures ping. Nothing here ever gives up on you.
 * ===================================================================================== */
async function api(type, data, opt) {
  opt = opt || {}; data = data || {};
  const tries = opt.retry == null ? 3 : opt.retry;
  for (let i = 0; i <= tries; i++) {
    try {
      const r = await fetch('/api/act', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room: session.code, pid: session.pid, token: session.token, type, ...data }) });
      if (r.status === 401) { sessionOver('Your session has ended.'); return { error: 'expired' }; }
      const j = await r.json();
      if (j.error && !opt.quiet) toast(j.error);
      return j;
    } catch (e) { await sleep(400 * (i + 1)); }      // slow or dropped connection: keep trying, never lose the action
  }
  if (!opt.quiet) toast('Connection is slow. Your action may be delayed.');
  return { error: 'network' };
}
function connect() {
  if (es) es.close();
  es = new EventSource(`/api/events?room=${session.code}&pid=${session.pid}&token=${session.token}`);
  es.onopen = () => { ui.online = true; renderBanner(); };
  es.onerror = () => { ui.online = false; renderBanner(); if (es.readyState === 2) setTimeout(recheck, 2000); };
  es.addEventListener('state', e => onState(JSON.parse(e.data)));
  es.addEventListener('pings', e => { pings = JSON.parse(e.data); paintPings(); });
  es.addEventListener('signal', e => onSignal(JSON.parse(e.data)));
  es.addEventListener('chatlog', e => { $('#msgs').innerHTML = ''; JSON.parse(e.data).forEach(m => addMsg(m, false)); });
  es.addEventListener('chat', e => addMsg(JSON.parse(e.data), true));
}
async function recheck() {
  try {
    const r = await fetch('/api/resume', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(session) });
    if (r.status === 404) return sessionOver('That game is no longer available.');
  } catch (e) {}
  if (session) connect();
}
async function heartbeat() {
  if (!session) return;
  const t = performance.now();
  try {
    await fetch('/api/ping?_=' + Math.round(t), { cache: 'no-store' });
    ui.myPing = Math.round(performance.now() - t);
    paintMyPing();
    api('hb', { ms: ui.myPing }, { quiet: true, retry: 0 });
  } catch (e) { ui.myPing = null; paintMyPing(); }
}
function sessionOver(msg) {
  if (es) es.close();
  for (const id of [...peers.keys()]) closePeer(id);
  session = null; st = null; store.del('mafia:session');
  document.documentElement.classList.remove('night');

  ui.inviteCode = null; ui.homeErr = msg || '';
  renderHome();
}

function onState(v) {
  st = v; offset = v.now - Date.now();
  const key = v.phase + ':' + v.night + ':' + (v.vote ? v.vote.round : 0);
  const changed = key !== ui.phaseKey, first = !ui.phaseKey;
  if (changed) { ui.phaseKey = key; ui.detPick = null; if (!first) announce(v); }
  ui.pendingSel = null; ui.animCards = changed;
  document.documentElement.classList.toggle('night', v.phase === 'night' || v.phase === 'reveal');
  renderTop(); renderMain(); renderPlayers(); renderNotes(); renderAudio(); renderChatMeta(); renderBanner(); paintStage();

function announce(v) {
  // The narrator speaks each event exactly once on this device, even if the page reconnects or the server re-sends state.
  const mark = 'n:' + v.game + ':' + ui.phaseKey;
  if (ui.said.has(mark)) return;
  ui.said.add(mark);
  // The long instructions are read the first time only; later rounds get just the short fact.
  const first = k => { const f = !ui.intro[k]; ui.intro[k] = true; return f; };
  const names = ids => ids.map(nameOf).join(' and ');
  switch (v.phase) {
    case 'reveal': ui.intro = {}; narrate('The roles have been dealt. Look at your card.'); break;
    case 'night': narrate(first('night') ? `Night ${v.night} falls. Everyone, close your eyes. Mafia, wake up.` : `Night ${v.night} falls.`); playCine([sceneNight(v.night)]); break;
    case 'dawn': {
      const d = v.dawn || { deaths: [], saves: [], injured: [] };
      let t = d.deaths.length ? `Morning. ${names(d.deaths.map(x => x.id))} did not wake up.` : 'Morning. Nobody died last night.';
      if (d.injured && d.injured.length) t += ` ${names(d.injured.map(x => x.id))} ${d.injured.length === 1 ? 'was' : 'were'} badly hurt.`;
      if (d.saves && d.saves.length) t += ` ${names(d.saves)} was attacked, but the doctor saved them.`;
      narrate(t); playCine(dawnScenes(v)); break;
    }
    case 'day': narrate(first('day') ? 'Discussion time. Talk it out.' : `Day ${v.night}.`); break;
    case 'vote': narrate(v.vote && v.vote.round === 2 ? 'Revote. Choose between the tied players.' : first('vote') ? 'Voting begins. Choose who to eliminate.' : 'Voting begins.'); break;
    case 'result': narrate(v.result && v.result.pid ? `${nameOf(v.result.pid)} has been voted out.` : 'Nobody was eliminated.'); playCine([sceneVerdict(v.result)]); break;
    case 'over': narrate((v.winner && WIN[v.winner.key] ? WIN[v.winner.key].title : 'Game over') + '.'); if (v.winner) playCine([sceneWin(v.winner)]); break;
  }
}

  el.textContent = ms == null ? 'offline' : ms + ' ms';

function paintPings() {
  if (!st) return;
  for (const p of st.players) {
    const el = document.querySelector(`[data-ping="${p.id}"]`); if (!el) continue;
    const i = pings[p.id];
    let txt = '…', cls = 'ping';
    if (i) {
      if (i.left) txt = 'left the game';
      else if (!i.c) { txt = 'reconnecting…'; cls += ' bad'; }
      else if (i.st) { txt = 'unstable connection'; cls += ' warn'; }
      else if (i.ms == null) txt = '… ms';
      else { txt = i.ms + ' ms'; if (i.ms >= st.highMs) { txt += ' · high ping'; cls += ' bad'; } else if (i.ms >= 120) cls += ' warn'; else cls += ' good'; }

/* ---------- players ("the table") ---------- */
function targetInfo() {
  const none = { ids: new Set(), selected: null };
  if (!st || !st.you.alive) return none;
  if (st.phase === 'night' && st.you.action && st.you.action.kind !== 'decoy') {
    const a = st.you.action, sel = a.selected === 'hold' ? null : a.selected;
    if (a.locked) return { ids: new Set(), selected: sel };
    if (a.kind === 'mafia') {
      const needsTarget = ['attack', 'delayed_attack', 'frame', 'observe'].includes(ui.mafiaAction);
      if (!needsTarget) return { ids: new Set(), selected: null };
      // a.selected is this player's own last-confirmed {action,target}; only show it as the
      // highlighted target if it matches the action currently selected in the UI, so switching
      // from e.g. Attack to Frame doesn't leave the old Attack target looking picked.
      const confirmed = a.selected && a.selected.action === ui.mafiaAction ? a.selected.target : null;
      return { ids: new Set(a.options), selected: ui.pendingSel || confirmed };
    }
    return { ids: new Set(a.options), selected: ui.pendingSel || ui.detPick || sel };
  }
  if (st.phase === 'vote') {
    const mine = st.vote.votes[st.meId];
    return { ids: new Set(st.vote.cands.filter(id => id !== st.meId)), selected: ui.pendingSel || (mine && mine !== 'skip' ? mine : null) };
  }
  return none;
}
function renderPlayers() {
  const el = $('#players'); if (!el) return;
  const t = targetInfo();
  const cards = st.players.map((p, idx) => {
    const me = p.id === st.meId, role = p.role ? ROLES[p.role] : null;
    const cls = ['pl']; if (!p.alive) cls.push('dead'); if (me) cls.push('me'); if (t.ids.has(p.id)) cls.push('tgt'); if (t.selected === p.id) cls.push('sel');
    const vcount = st.phase === 'vote' ? Object.values(st.vote.votes).filter(x => x === p.id).length : 0;
    const casts = st.phase === 'vote' && st.vote.votes[p.id] ? `<span class="vtag">→ ${st.vote.votes[p.id] === 'skip' ? 'skip' : esc(nameOf(st.vote.votes[p.id]))}</span>` : '';
    return `<div class="${cls.join(' ')}" style="--i:${idx}" data-a="pl" data-id="${p.id}" data-pl="${p.id}"${t.ids.has(p.id) ? ' role="button" tabindex="0"' : ''}>
      <span class="av" style="background:${esc(p.color)}">${esc((p.name[0] || '?').toUpperCase())}</span>
      <span class="nm">${esc(p.name)}${p.host ? ' ★' : ''}${me ? ' (you)' : ''}</span>
      <span class="ping" data-ping="${p.id}"></span>
      ${role ? `<span class="rtag">${role.icon} ${role.name}</span>` : (!p.alive && st.phase !== 'lobby' ? '<span class="rtag">🪦 out</span>' : '')}
      ${vcount ? `<span class="vtag">${vcount} vote${vcount > 1 ? 's' : ''}</span>` : ''}${casts}
      ${st.phase === 'day' && p.ready ? '<span class="vtag">ready</span>' : ''}</div>`;
  }).join('');
  el.innerHTML = `<p class="note">Players (${st.players.filter(p => p.alive).length} alive)</p><div class="pgrid${ui.animCards ? ' enter' : ''}">${cards}</div>`;
  paintPings();
}
function onPlayerClick(id) {
  const t = targetInfo(); if (!t.ids.has(id)) return;
  if (st.phase === 'night') {
    if (st.you.action.kind === 'detective') { ui.detPick = id; renderMain(); renderPlayers(); return; }
    if (st.you.action.kind === 'mafia') { ui.pendingSel = id; renderPlayers(); api('night', { action: ui.mafiaAction, target: id }); return; }
    ui.pendingSel = id; renderPlayers(); api('night', { target: id });
  } else if (st.phase === 'vote') {
    const mine = st.vote.votes[st.meId];
    if (mine === id) { ui.pendingSel = null; api('vote', { target: null }); return; }
    ui.pendingSel = id; renderPlayers(); api('vote', { target: id });
  }
}

  const micLabel = !voice.stream ? 'Turn on microphone' : ui.micOn ? 'Mic on. Tap to mute' : 'Mic muted. Tap to unmute';
  const swRow = (k, label, sub, on) => `<div class="row"><div><div class="rn">${label}</div><div class="muted small">${sub}</div></div><button class="sw" role="switch" aria-checked="${on}" aria-label="${label}" data-a="${k}"></button></div>`;
  const vsel = (k, label) => `<div class="row" style="display:block"><div class="rn" style="margin-bottom:6px">${label}</div><select data-vp="${k}" style="width:100%" aria-label="${label}">${voiceOptions(k)}</select></div>`;
  el.innerHTML = `<div class="panel"><p class="note">Voice and sound</p>
    <p style="margin:0 0 10px"><b>${vl[0]} ${vl[1]}</b></p>
    <button class="btn ${ui.micOn ? '' : 'primary'}" data-a="mic">${micLabel}</button>
    ${ui.audioBlocked ? '<button class="btn quiet" data-a="unblock" style="margin-top:10px">Tap to hear other players</button>' : ''}
    <p class="muted small" id="vlinks" style="margin:10px 0 0"></p>
    ${TTS.ok ? swRow('tts', 'Read chat aloud', 'Typed messages are spoken in the sender’s chosen voice.', ui.ttsOn) + swRow('narr', 'Narrator', 'Announces nights, deaths and votes once each, on this device only. Turn it off on a second device in the same room.', ui.narratorOn) : ''}
    ${swRow('sfx', 'Sound effects', 'Night, morning, murder, saves and verdicts.', ui.sfxOn)}
    ${TTS.ok ? `<details style="margin-top:8px"><summary class="rn" style="cursor:pointer;min-height:40px;display:flex;align-items:center">Pick better voices</summary>
      <p class="muted small" style="margin:4px 0 8px">Voices come from your device. ★ marks the most natural ones. On Windows, Microsoft Edge has the best (look for “Natural”). Changing a voice plays a sample.</p>
      ${vsel('male', 'Male voice')}${vsel('female', 'Female voice')}${vsel('neutral', 'Narrator voice')}</details>` : ''}</div>`;
  paintLinks();
}

/* ---------- chat ---------- */
function renderChatMeta() {
  const lab = $('#chLabel'), inp = $('#chatInput'), btn = $('#chatForm button'); if (!lab) return;
  const ch = st.channel;
  const names = { all: st.phase === 'lobby' ? 'Lobby chat' : 'Town chat', mafia: '🕶️ Mafia chat (only your team sees this)', dead: '🪦 Ghost chat (only ghosts see this)' };
  lab.textContent = ch ? names[ch] : '🌙 Everyone is asleep. Chat is closed until morning.';
  inp.disabled = !ch; btn.disabled = !ch;
  inp.placeholder = ch ? 'Type a message. It will be read aloud.' : 'Chat is closed';
}
function addMsg(m, live) {
  const box = $('#msgs'); if (!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const div = document.createElement('div');
  if (m.ch === 'sys') { div.className = 'msg sys'; div.textContent = m.text; }
  else {
    const p = st && st.players.find(x => x.id === m.from);
    div.className = 'msg ' + m.ch;
    const who = document.createElement('span'); who.className = 'who'; who.style.color = p ? p.color : 'inherit'; who.textContent = m.name + ': ';
    const tx = document.createElement('span'); tx.textContent = m.text;
    div.append(who, tx);
  }
  box.appendChild(div);
  while (box.children.length > 200) box.removeChild(box.firstChild);
  if (near || !live) box.scrollTop = box.scrollHeight;
  if (live && m.ch !== 'sys' && ui.ttsOn && st && m.from !== st.meId) speak(`${m.name} says: ${m.text}`, m.gender);
}

/* =====================================================================================
 * EVENTS
 * ===================================================================================== */
function modal(html) { $('#modal').innerHTML = html ? `<div class="scrim"><div class="modal stack tight">${html}</div></div>` : ''; }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Invite link copied'); }
  catch (e) { const b = $('#linkBox'); if (b) { b.select(); document.execCommand && document.execCommand('copy'); } toast('Link ready to copy'); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const a = t.dataset.a, d = t.dataset;
  switch (a) {
    case 'gender': ui.gender = d.v; profile(); document.querySelectorAll('.seg [data-a="gender"]').forEach(b => b.classList.toggle('on', b.dataset.v === d.v)); break;
    case 'preview': speak(`Hi${ui.name.trim() ? ', I’m ' + ui.name.trim() : ''}. This is how your messages will sound.`, ui.gender, true); if (!TTS.ok) toast('This browser can’t read text aloud.'); break;
    case 'create': enter('/api/create', { name: ui.name.trim(), gender: ui.gender }); break;
    case 'join': enter('/api/join', { code: ui.inviteCode, name: ui.name.trim(), gender: ui.gender }); break;
    case 'joinCode': { const c = ($('#code').value || '').trim().toUpperCase(); if (!c) { $('#homeErr').textContent = 'Enter the room code from your friend.'; break; } enter('/api/join', { code: c, name: ui.name.trim(), gender: ui.gender }); break; }
    case 'clearInvite': ui.inviteCode = null; history.replaceState(null, '', location.pathname); renderHome(); break;
    case 'resume': { const s = store.get('mafia:session'); if (s) { session = s; resumeSession(); } break; }
    case 'copyLink': copy(inviteLink()); break;
    case 'share': navigator.share({ title: 'Join my Mafia game', text: `Join my Mafia game. Room ${session.code}`, url: inviteLink() }).catch(() => {}); break;
    case 'set': api('settings', { settings: { [d.k]: !st.settings[d.k] } }); break;
    case 'mafiaAuto': api('settings', { settings: { mafiaAuto: true } }); break;
    case 'mafiaManual': api('settings', { settings: { mafiaAuto: false, mafiaCount: st.plan ? st.plan.team : 2 } }); break;
    case 'mafiaInc': api('settings', { settings: { mafiaAuto: false, mafiaCount: (st.plan ? st.plan.team : 1) + 1 } }); break;
    case 'mafiaDec': api('settings', { settings: { mafiaAuto: false, mafiaCount: Math.max(1, (st.plan ? st.plan.team : 2) - 1) } }); break;
    case 'setTie': api('settings', { settings: { tie: d.v } }); break;
    case 'start': api('start'); break;
    case 'again': api('again'); break;
    case 'pl': onPlayerClick(d.id); break;
    case 'detConfirm': if (ui.detPick) { const id = ui.detPick; ui.detPick = null; api('night', { target: id }); } break;
    case 'hold': api('night', { target: 'hold' }); break;
    case 'mafiaAction': ui.mafiaAction = d.k; ui.pendingSel = null; renderMain(); renderPlayers(); break;
    case 'mafiaConfirm': api('night', { action: ui.mafiaAction, target: null }); break;
    case 'ready': api('ready'); break;
    case 'skip': api('vote', { target: 'skip' }); break;
    case 'clearVote': api('vote', { target: null }); break;
    case 'mic': toggleMic(); break;
    case 'unblock': resumeAudio(); ui.audioBlocked = false; renderAudio(); break;
    case 'tts': ui.ttsOn = !ui.ttsOn; if (!ui.ttsOn && TTS.ok) { TTS.queue.length = 0; speechSynthesis.cancel(); } renderAudio(); break;
    case 'sfx': ui.sfxOn = !ui.sfxOn; if (ui.sfxOn) sfx('morning'); renderAudio(); break;
    case 'cineSkip': skipCine(); break;
    case 'narr': ui.narratorOn = !ui.narratorOn; renderAudio(); break;
    case 'leaveAsk': modal('<h3 class="h3">Leave this game?</h3><p class="muted">If the game has started, your seat stays but you’ll no longer take part. If you just lost connection, refresh instead. You’ll rejoin automatically.</p><div class="two"><button class="btn" data-a="leaveNo">Stay</button><button class="btn primary" data-a="leaveYes">Leave</button></div>'); break;
    case 'leaveNo': modal(''); break;
    case 'leaveYes': modal(''); api('leave', {}, { quiet: true, retry: 1 }).then(() => sessionOver('')); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'code') { const b = document.querySelector('[data-a="joinCode"]'); if (b && !b.disabled) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'name') { const b = document.querySelector('[data-a="create"],[data-a="join"]'); if (b && !b.disabled) b.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pl') && e.target.classList.contains('tgt')) { e.preventDefault(); onPlayerClick(e.target.dataset.id); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'name') {
    ui.name = e.target.value;
    document.querySelectorAll('[data-need-name]').forEach(b => { b.disabled = !ui.name.trim(); });
  }
  if (e.target.id === 'code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.s;
  if (k) api('settings', { settings: { [k]: +e.target.value } });
  const vp = e.target.dataset && e.target.dataset.vp;
  if (vp) {
    ui.voicePref[vp] = e.target.value; store.set('mafia:voices', ui.voicePref); ui.audioSig = '';
    if (TTS.ok) { TTS.queue.length = 0; try { speechSynthesis.cancel(); } catch (x) {} TTS.busy = false; TTS.cur = null; speak(vp === 'neutral' ? 'Night falls. Everyone, close your eyes.' : 'Hello, this is how I will sound in the game.', vp, true); }
  }
});

/* =====================================================================================
 * BOOT
 * ===================================================================================== */
async function resumeSession() {
  try {
    const r = await fetch('/api/resume', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(session) });
    if (r.ok) { history.replaceState(null, '', `${location.pathname}?r=${session.code}`); return enterRoom(); }
  } catch (e) { /* server unreachable: fall through to the home page, session is kept for retry */ }
  session = null; renderHome();
}
function boot() {
  const q = new URLSearchParams(location.search);
  const code = (q.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);
  const saved = store.get('mafia:session');
  if (saved && (!code || code === saved.code)) { session = saved; resumeSession(); return; }
  ui.inviteCode = code || null;
  renderHome();
}
boot();
</script>
</body>
</html>
